engine('towers',{cat:'d',title:'La cité des moyennes',mechanic:'Répartir des cubes',desc:'Déplace les étages pour donner la même hauteur aux quatre tours.',grades:[5,6,7,8,9],topic:()=> 'Répartition équitable et sens de la moyenne',idea:'La moyenne est la valeur commune qu’on obtiendrait en répartissant équitablement le total. Déplacer les cubes conserve la somme.',create(g,l){let mean=rand(4,7);return{heights:[mean-3,mean-1,mean+1,mean+3],mean,selected:null,initial:[mean-3,mean-1,mean+1,mean+3]}},goal:d=>`Répartis les ${d.mean*4} étages pour que les quatre tours aient la même hauteur.`,instruction:()=> 'Touche une tour pour y prendre un étage, puis une autre pour l’y déposer. Aucun cube ne peut être créé ni supprimé.',render(d){return `<div class="stats-towers">${d.heights.map((v,i)=>`<div class="tower-wrap ${d.selected===i?'selected':''}"><button style="width:100%;padding:0" data-action="tower" data-i="${i}" aria-label="Tour ${i+1}, ${v} étages${d.selected===i?', sélectionnée':''}"><div class="tower">${Array.from({length:v},()=>'<i class="tower-block"></i>').join('')}</div><span>Tour ${i+1} · ${v}</span></button></div>`).join('')}</div>${hud([`Total conservé : <b>${d.mean*4}</b>`,d.selected===null?'Choisis une tour de départ':`Départ : <b>tour ${d.selected+1}</b> · choisis l’arrivée`])}<div class="board-controls">${tool('Inaugurer la cité','check','','selected')}</div>`},act(d,a,i){i=Number(i);if(a==='tower'){if(d.selected===null){if(d.heights[i]>0)d.selected=i}else if(d.selected===i)d.selected=null;else{if(d.heights[i]<14){d.heights[d.selected]--;d.heights[i]++}d.selected=null}}if(a==='check'){if(d.heights.every(v=>v===d.mean))win(`Les quatre tours ont ${d.mean} étages. La moyenne de ${d.initial.join(', ')} est (${d.initial.join(' + ')}) ÷ 4 = ${d.mean}. Le nombre total d’étages n’a pas changé.`);else message('Les hauteurs sont encore différentes. Déplace des étages des tours les plus hautes vers les plus basses.','error')}}});
// 13. Probabilités : concevoir une expérience plutôt que deviner une réponse.
engine('chance',{cat:'d',title:'Le laboratoire du hasard',mechanic:'Fabriquer une expérience',desc:'Compose une urne, teste des tirages et compare modèle et expérience.',grades:[5,6,7,8,9],topic:g=>g===5?'Chances dans une expérience simple':'Probabilités et fréquences expérimentales',idea:'Avec des billes équiprobables, la probabilité d’une couleur est son effectif divisé par le total. La fréquence de 100 tirages peut s’en écarter : le hasard ne promet pas un résultat exact.',create(g,l){let den=g<7?choose([2,3,4]):choose([3,4,5,6]),n=rand(1,den-1),total=den*rand(2,3);return{den,n,total,p:0,y:0,draws:null}},goal:d=>`Compose une urne de ${d.total} billes avec ${rat(d.n,d.den)} de chances de tirer une violette.`,instruction:()=> 'Ajoute ou retire des billes, puis teste ton urne. Les tirages se font avec remise : chaque bille revient dans l’urne.',render(d){return `<div class="urn-wrap"><div class="urn" aria-label="Urne contenant ${d.p} billes violettes et ${d.y} jaunes">${Array.from({length:d.p},()=>'<i class="marble"></i>').join('')}${Array.from({length:d.y},()=>'<i class="marble yellow"></i>').join('')}${d.p+d.y===0?'<span style="font-size:11px;color:#a68eb7">Ton urne est vide</span>':''}</div><div class="urn-tools"><div>${tool(`+ Violette (${d.p})`,'purple')}${tool('−','unpurple','aria-label="Retirer une bille violette"')}</div><div>${tool(`+ Jaune (${d.y})`,'yellow')}${tool('−','unyellow','aria-label="Retirer une bille jaune"')}</div></div></div>${hud([`Billes : <b>${d.p+d.y}/${d.total}</b>`,`Probabilité violette : <b>${d.p+d.y?rat(d.p,d.p+d.y):'—'}</b>`])}<div class="board-controls">${tool('Simuler 100 tirages','experiment')}${tool('Activer le laboratoire','check','','selected')}</div>${d.draws?`<div class="experiment">${d.draws.filter(Boolean).length} violettes sur 100 tirages avec remise. Fréquence : ${d.draws.filter(Boolean).length} %. Probabilité du modèle au moment du test : ${d.testProbability}.<div class="experiment-dots">${d.draws.map(v=>`<i class="${v?'':'yellow'}"></i>`).join('')}</div></div>`:''}`},act(d,a){if(a==='purple'&&d.p+d.y<36)d.p++;if(a==='yellow'&&d.p+d.y<36)d.y++;if(a==='unpurple'&&d.p>0)d.p--;if(a==='unyellow'&&d.y>0)d.y--;if(a==='experiment'){if(!d.p&&!d.y)message('Ajoute des billes avant de lancer les tirages.','error');else{d.draws=Array.from({length:100},()=>Math.random()<d.p/(d.p+d.y));d.testProbability=rat(d.p,d.p+d.y)}}if(a==='check'){if(d.p+d.y===d.total&&d.p*d.den===d.n*d.total)win(`Ton urne contient ${d.p} violettes sur ${d.total} billes : ${d.p}/${d.total} = ${rat(d.n,d.den)}. La composition fixe la probabilité, mais chaque série de tirages reste aléatoire.`);else message(d.p+d.y!==d.total?`Le laboratoire demande exactement ${d.total} billes.`:'Le total est bon. Ajuste la proportion des deux couleurs sans changer le nombre total de billes.','error')}}});
// 14. Fonction : régler une trajectoire pour toucher des points exacts.
engine('constellation',{cat:'a',title:'Le pilote des fonctions',mechanic:'Tracer une trajectoire',desc:'Règle une fonction pour faire passer ta trajectoire par les balises.',grades:[7,9],topic:g=>g===7?'Fonctions : correspondance entrée-sortie (2026)':'Fonctions linéaires et affines',idea:'Pour f(x) = ax + b, a règle la pente et b la hauteur au passage de l’axe vertical. Passer par deux points distincts fixe une seule droite.',create(g,l){let a=g===7?rand(1,3):choose([-2,-1,1,2]),b=g===7?0:rand(-2,2);return{a,b,A:0,B:0,g,xs:[-2,0,2]}},goal:()=> 'Fais passer la trajectoire violette par les trois balises dorées.',instruction:d=>`Règle ${d.g===7?'le multiplicateur a':'la pente a et le décalage b'}. Les coordonnées des balises sont indiquées. Lance ensuite le vaisseau.`,render(d){let body='';const X=x=>230+x*37,Y=y=>190-y*18;for(let i=-5;i<=5;i++)body+=`<path d="M${X(i)} 10V370" stroke="#efe8f6"/><text x="${X(i)+3}" y="203" font-size="9" fill="#b09abe">${i}</text>`;for(let i=-10;i<=10;i++)body+=`<path d="M40 ${Y(i)}H420" stroke="#efe8f6"/>${i%2===0?`<text x="234" y="${Y(i)-3}" font-size="9" fill="#b09abe">${i}</text>`:''}`;body+=`<path d="M40 190h380M230 10v360" stroke="#baa3cf"/><path d="M${X(-5)} ${Y(d.A*-5+d.B)}L${X(5)} ${Y(d.A*5+d.B)}" stroke="#a180ce" stroke-width="3"/>`;d.xs.forEach(x=>body+=`<circle cx="${X(x)}" cy="${Y(d.a*x+d.b)}" r="8" fill="#efd29a" stroke="#c3a058" stroke-width="2"/><circle cx="${X(x)}" cy="${Y(d.A*x+d.B)}" r="4" fill="#9672bf"/>`);return `<div class="graph-wrap">${art(body,460,380)}</div><div class="graph-targets">${d.xs.map(x=>`<span>Balise (${x} ; ${d.a*x+d.b})</span>`).join('')}</div>${slider('Valeur de a','A',d.A,d.g===7?0:-3,3)}${d.g===7?'':slider('Valeur de b','B',d.B,-5,5)}<div class="balance-expression">f(x) = ${expression(d.A,d.B)}</div><div class="board-controls">${tool('Lancer le vaisseau','check','','selected')}</div>`},act(d,a){if(a==='check'){if(d.A===d.a&&d.B===d.b)win(`La trajectoire est f(x) = ${expression(d.a,d.b)}. ${d.xs.map(x=>`f(${x}) = ${d.a*x+d.b}`).join(' ; ')}. Les trois balises sont sur la même droite.`);else message(`${d.xs.filter(x=>d.a*x+d.b===d.A*x+d.B).length} balise(s) traversée(s) sur 3. Ajuste la règle de la trajectoire.`,'error')}}});
// 15. Arithmétique : découper un produit sans changer sa valeur.
engine('primes',{cat:'n',title:'La forge des nombres premiers',mechanic:'Découper & recomposer',desc:'Sépare les blocs composites jusqu’à ne garder que des facteurs premiers.',grades:[8,9],topic:()=> 'Divisibilité et décomposition en facteurs premiers',idea:'Décomposer un nombre consiste à écrire un produit de nombres premiers. Chaque découpe conserve le produit de tous les blocs.',create(g,l){let factors=Array.from({length:l+2},()=>choose(g===8?[2,3,5]:[2,3,5,7]));let total=factors.reduce((a,b)=>a*b,1);return{total,nodes:[total],selected:0}},goal:d=>`Décompose le noyau ${d.total} en un produit de nombres premiers.`,instruction:()=> 'Sélectionne un bloc, puis une lame qui le divise exactement. Un bloc vert est premier : il n’a plus besoin d’être découpé.',render(d){return `<div class="factor-nodes">${d.nodes.map((n,i)=>`${i?'<span class="factor-times">×</span>':''}<button class="factor-node ${isPrime(n)?'prime':''} ${d.selected===i?'selected':''}" data-action="select" data-i="${i}" aria-label="Sélectionner le facteur ${n}">${n}</button>`).join('')}</div>${hud([`Produit conservé : <b>${d.nodes.reduce((a,b)=>a*b,1)}</b>`,`Blocs premiers : <b>${d.nodes.filter(isPrime).length}/${d.nodes.length}</b>`])}<div class="board-controls">${[2,3,5,7,11,13].map(p=>tool(`÷ ${p}`,'cut',`data-i="${p}"`)).join('')}</div><div class="board-controls">${tool('Stabiliser le noyau','check','','selected')}</div>`},act(d,a,i){i=Number(i);if(a==='select')d.selected=i;if(a==='cut'){let n=d.nodes[d.selected];if(isPrime(n))message('Ce bloc est déjà premier. Choisis un autre bloc.','error');else if(n%i)message(`${n} n’est pas divisible par ${i}. Essaie une autre lame.`,'error');else{d.nodes.splice(d.selected,1,i,n/i);d.selected=d.nodes.findIndex(n=>!isPrime(n));if(d.selected<0)d.selected=0}}if(a==='check'){if(d.nodes.every(isPrime))win(`${d.total} = ${d.nodes.slice().sort((a,b)=>a-b).join(' × ')}. Tous les facteurs sont premiers : le noyau est stabilisé.`);else message('Il reste au moins un bloc composite. Sépare-le encore en deux facteurs.','error')}}});
function isPrime(n){if(n<2)return false;for(let i=2;i*i<=n;i++)if(n%i===0)return false;return true}
// 16. Pythagore : dimensionner une passerelle pour atteindre une plateforme.
engine('ladder',{cat:'g',title:'La passerelle de Pythagore',mechanic:'Dimensionner & tester',desc:'Assemble la bonne longueur de passerelle pour atteindre la plateforme.',grades:[8,9],topic:()=> 'Triangle rectangle et théorème de Pythagore',idea:'Dans un triangle rectangle, le carré de l’hypoténuse est la somme des carrés des deux autres côtés. On cherche une longueur positive.',create(g,l){let[a,b,c]=choose(l===1?[[3,4,5],[6,8,10]]:[[5,12,13],[8,15,17],[9,12,15]]);return{a,b,c,length:1}},goal:d=>`Rejoins une plateforme située ${d.b} m plus haut et ${d.a} m plus loin.`,instruction:()=> 'Le mur et le sol forment un angle droit. Assemble les segments pour choisir la longueur de la passerelle, puis teste-la.',render(d){const scale=230/Math.max(d.a,d.b),baseX=70,baseY=265,wallX=baseX+d.a*scale,targetY=baseY-d.b*scale,reach=Math.sqrt(Math.max(0,d.length*d.length-d.a*d.a)),endY=baseY-reach*scale;return `<div class="bridge-scene">${art(`<rect x="0" y="0" width="460" height="300" rx="12" fill="#e9f0f4"/><path d="M0 265H460" stroke="#b9c3b0" stroke-width="8"/><rect x="${wallX}" y="${targetY}" width="${460-wallX}" height="${265-targetY}" fill="#c9bbd8"/><rect x="${wallX-7}" y="${targetY-4}" width="75" height="9" rx="4" fill="#ddbd7a"/><path d="M${baseX} ${baseY-5}L${d.length>=d.a?wallX:baseX+d.length*scale} ${d.length>=d.a?Math.max(-80,endY):baseY-5}" stroke="#9b7ebf" stroke-width="7" stroke-linecap="round"/><path d="M${wallX-15} 265v-15h15" stroke="#aa96bc" fill="none"/><text x="${baseX+d.a*scale/2}" y="287" text-anchor="middle" fill="#917ca3" font-size="12">${d.a} m</text><text x="${Math.min(430,wallX+16)}" y="${targetY+(265-targetY)/2}" fill="#917ca3" font-size="12">${d.b} m</text><g transform="translate(${Math.min(420,wallX+20)} ${targetY-13})"><g transform="translate(0 -18.7) scale(0.6875)" style="font-size:32px"><svg class="pictogram pictogram-gem" style="width:1em;height:1em;pointer-events:none;vertical-align:-.13em" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><image href="assets/pic-gem.png" width="32" height="32" preserveAspectRatio="xMidYMid meet"/></svg></g></g>`,460,300)}</div>${slider('Longueur','length',d.length,1,25,1,' m')}<div class="board-controls">${tool('Tester la passerelle','check','','selected')}</div>`},act(d,a){if(a==='check'){if(d.length===d.c)win(`${d.a}² + ${d.b}² = ${d.a*d.a+d.b*d.b}. La longueur de la passerelle est √${d.a*d.a+d.b*d.b} = ${d.c} m. Elle atteint exactement la plateforme.`);else message(d.length<d.c?'La passerelle est trop courte : elle n’atteint pas la plateforme.':'La passerelle est trop longue pour rejoindre exactement le bord de la plateforme.','error')}}});
// 17. Cosinus en 4e ; sinus, cosinus, tangente en 3e.
engine('radar',{cat:'g',title:'Le radar des angles',mechanic:'Orienter un faisceau',desc:'Oriente le radar pour rejoindre une balise avec la bonne inclinaison.',grades:[8,9],topic:g=>g===8?'Cosinus dans le triangle rectangle':'Sinus, cosinus et tangente',idea:'Dans un triangle rectangle : cos(angle) = adjacent / hypoténuse ; sin(angle) = opposé / hypoténuse ; tan(angle) = opposé / adjacent. La calculatrice doit être réglée en degrés.',create(g,l){let angle=choose([30,45,60]),hyp=choose([10,12,20]),rad=angle*Math.PI/180;return{angle,hyp,x:hyp*Math.cos(rad),y:hyp*Math.sin(rad),aim:10,kind:g===8||l===1?'cosinus':l===2?'tangente':'sinus'}},goal:d=>d.kind==='cosinus'?`Le faisceau mesure ${d.hyp} m. Sa projection horizontale doit mesurer ${fmt(d.x)} m. Oriente-le pour toucher la balise.`:d.kind==='sinus'?`Le faisceau mesure ${d.hyp} m et doit atteindre une hauteur de ${fmt(d.y)} m. Oriente-le vers la balise.`:`La balise est à ${fmt(d.x)} m horizontalement et à ${fmt(d.y)} m de hauteur. Règle l’angle du radar.`,instruction:d=>`Utilise le ${d.kind} pour prévoir l’angle, puis oriente le faisceau et teste sa direction. Les distances affichées sont arrondies au centimètre.`,render(d){const s=210/d.hyp,X=70,Y=260,tx=X+d.x*s,ty=Y-d.y*s,ex=X+d.hyp*Math.cos(d.aim*Math.PI/180)*s,ey=Y-d.hyp*Math.sin(d.aim*Math.PI/180)*s;let scene=`<rect width="460" height="300" rx="15" fill="#e8edf6"/><path d="M40 260h380" stroke="#c4b9d3" stroke-width="3"/><path d="M${tx} ${ty}V260H70" stroke="#bdaacb" stroke-dasharray="5 5" fill="none"/><path d="M${tx-13} 260v-13h13" fill="none" stroke="#b3a0c2"/><path d="M${X} ${Y}L${ex} ${ey}" stroke="#b093d7" stroke-width="5" stroke-linecap="round"/><circle cx="${tx}" cy="${ty}" r="12" fill="#f0d69e" stroke="#ceb275" stroke-width="2"/><circle cx="${ex}" cy="${ey}" r="5" fill="#8e70b2"/><circle cx="70" cy="260" r="12" fill="#b69cd2"/><text x="96" y="250" fill="#9c7ab8" font-size="13">${d.aim}°</text>`;if(d.kind!=='sinus')scene+=`<text x="${(X+tx)/2}" y="283" fill="#9982ad" text-anchor="middle" font-size="12">${fmt(d.x)} m</text>`;if(d.kind!=='cosinus')scene+=`<text x="${tx+15}" y="${(ty+Y)/2}" fill="#9982ad" font-size="12">${fmt(d.y)} m</text>`;if(d.kind!=='tangente')scene+=`<text x="${(X+ex)/2-20}" y="${(Y+ey)/2-13}" fill="#9c7ab8" font-size="12">${d.hyp} m</text>`;return `<div class="radar-scene bridge-scene">${art(scene,460,300)}</div>${slider('Angle','aim',d.aim,5,85,1,'°')}<div class="board-controls">${tool('Activer le radar','check','','selected')}</div>`},act(d,a){if(a==='check'){if(Math.abs(d.aim-d.angle)<=.5)win(`Balise atteinte avec un angle de ${d.angle}°. ${d.kind==='cosinus'?`cos(${d.angle}°) ≈ ${fmt(d.x)}/${d.hyp}`:d.kind==='sinus'?`sin(${d.angle}°) ≈ ${fmt(d.y)}/${d.hyp}`:`tan(${d.angle}°) ≈ ${fmt(d.y)}/${fmt(d.x)}`}. Les longueurs affichées étaient arrondies.`);else message(d.aim<d.angle?'Le faisceau est trop bas. Augmente son inclinaison.':'Le faisceau passe trop haut. Diminue son inclinaison.','error')}}});
// 18. Puissances de dix comme transformations multiplicatives composables.
engine('reactor',{cat:'n',title:'Le satellite des puissances',mechanic:'Composer des amplificateurs',desc:'Assemble une chaîne de multiplicateurs pour alimenter un satellite.',grades:[8,9],topic:()=> 'Puissances de 10 et notation scientifique',idea:'Multiplier par 10^a puis par 10^b revient à multiplier par 10^(a+b). Diviser par 10^a revient à multiplier par 10^(−a).',create(g,l){let budget=l===1?2:3,exp=rand(1,budget*2)*(g===9?choose([-1,1]):1);return{base:rand(2,9),exp,budget,chain:[]}},goal:d=>`Fournis une énergie de ${d.base} × 10^${d.exp} au satellite, à partir de ${d.base}, avec 2 à ${d.budget} amplificateurs.`,instruction:()=> 'Ajoute des modules multiplicateurs ou diviseurs dans le circuit. Touche un module posé pour le retirer.',render(d){let sum=d.chain.reduce((a,b)=>a+b,0);return `<div style="padding:20px 5px;text-align:center"><div style="font-size:40px"><svg class="pictogram pictogram-battery" style="width:1em;height:1em;pointer-events:none;vertical-align:-.13em" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><image href="assets/pic-battery.png" width="32" height="32" preserveAspectRatio="xMidYMid meet"/></svg> <span style="font-size:22px;color:#b59bcd">→</span> <svg class="pictogram pictogram-satellite" style="width:1em;height:1em;pointer-events:none;vertical-align:-.13em" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><image href="assets/pic-satellite.png" width="32" height="32" preserveAspectRatio="xMidYMid meet"/></svg></div><div class="live-value">Énergie du circuit : <b>${d.base} × 10<sup>${sum}</sup></b></div><div class="factor-nodes" style="min-height:75px;margin:20px 0">${d.chain.map((n,i)=>`<button class="factor-node selected" style="font-size:16px" data-action="remove" data-i="${i}" aria-label="Retirer le module ${i+1}">${n>0?'×':'÷'} 10<sup>${Math.abs(n)}</sup></button>`).join('')||'<span style="font-size:12px;color:#b09abf">Le circuit attend ses modules</span>'}</div></div><div class="board-controls">${[1,2,-1,-2].map(n=>tool(`${n>0?'×':'÷'} 10${Math.abs(n)===2?'²':''}`,'module',`data-i="${n}"`)).join('')}</div>${hud([`Modules : <b>${d.chain.length}/${d.budget}</b>`,`Exposant total : <b>${sum}</b>`])}<div class="board-controls">${tool('Alimenter le satellite','check','','selected')}</div>`},act(d,a,i){if(a==='module'){if(d.chain.length<d.budget)d.chain.push(Number(i));else message('Le circuit est plein. Retire ou remplace un module.','error')}if(a==='remove')d.chain.splice(Number(i),1);if(a==='check'){let exp=d.chain.reduce((a,b)=>a+b,0);if(exp===d.exp&&d.chain.length>=2)win(`Les exposants se composent : ${d.chain.map(n=>`(${n})`).join(' + ')} = ${exp}. L’énergie finale est ${d.base} × 10^${exp}, une écriture scientifique car ${d.base} est compris entre 1 inclus et 10 exclu.`);else message(exp===d.exp?'L’énergie est bonne. Le circuit doit comporter au moins deux modules.':'L’exposant total n’est pas encore celui demandé. Compose multiplication et division.','error')}}});
// 19. Relatifs : déplacement effectif sur une droite graduée et planification.
engine('diver',{cat:'n',title:'Le sous-marin des relatifs',mechanic:'Planifier une trajectoire',desc:'Compose des déplacements signés pour récupérer un trésor et rentrer au port.',grades:[7,8,9],topic:g=>g===7?'Addition et soustraction de nombres relatifs':'Révision : déplacements et calculs relatifs',idea:'Un déplacement positif va vers les nombres plus grands ; un déplacement négatif va vers les plus petits. La position finale est la position de départ plus la somme des déplacements.',create(g,l){let start=rand(-7,-4),a=rand(2,4),b=-rand(2,4),c=rand(3,5),items=[a,b,c,-5].map((n,i)=>({n,id:i})).sort(()=>Math.random()-.5);return{start,checkpoint:start+a,end:start+a+b+c,items,history:[]}},goal:d=>`Pars de ${d.start}, récupère le trésor en ${d.checkpoint}, puis rejoins le port en ${d.end}, avec exactement trois déplacements.`,instruction:()=> 'Chaque carte déplace réellement le sous-marin. Les cartes sont à usage unique. Le trésor doit être visité à la fin d’un déplacement, avant l’arrivée au port.',render(d){let pos=d.start+d.history.reduce((s,i)=>s+d.items.find(v=>v.id===i).n,0),visited=[d.start];for(const id of d.history)visited.push(visited.at(-1)+d.items.find(v=>v.id===id).n);const X=x=>30+(x+15)*400/30;let body='<rect width="460" height="190" rx="14" fill="#e5f1f6"/><path d="M25 115h410" stroke="#a7bfce" stroke-width="2"/>';for(let i=-15;i<=15;i++)body+=`<path d="M${X(i)} 110v10" stroke="#a0b4c5"/>${i%3===0?`<text x="${X(i)}" y="137" text-anchor="middle" font-size="10" fill="#8ea3b5">${i}</text>`:''}`;body+=`<g transform="translate(${X(d.checkpoint)} 80)"><g transform="translate(-12 -20.4) scale(0.75)" style="font-size:32px">${visited.includes(d.checkpoint)?'<svg class="pictogram pictogram-sparkles" style="width:1em;height:1em;pointer-events:none;vertical-align:-.13em" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><image href="assets/pic-sparkles.png" width="32" height="32" preserveAspectRatio="xMidYMid meet"/></svg>':'<svg class="pictogram pictogram-gem" style="width:1em;height:1em;pointer-events:none;vertical-align:-.13em" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><image href="assets/pic-gem.png" width="32" height="32" preserveAspectRatio="xMidYMid meet"/></svg>'}</g></g><text x="${X(d.checkpoint)}" y="155" text-anchor="middle" font-size="10" fill="#a38baf">${d.checkpoint}</text><g transform="translate(${X(d.end)} 45)"><g transform="translate(-11.5 -19.55) scale(0.71875)" style="font-size:32px"><svg class="pictogram pictogram-anchor" style="width:1em;height:1em;pointer-events:none;vertical-align:-.13em" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><image href="assets/pic-anchor.png" width="32" height="32" preserveAspectRatio="xMidYMid meet"/></svg></g></g><text x="${X(d.end)}" y="65" text-anchor="middle" font-size="10" fill="#a38baf">${d.end}</text><g transform="translate(${X(pos)} 107)"><g transform="translate(-12.5 -21.25) scale(0.78125)" style="font-size:32px"><svg class="pictogram pictogram-boat" style="width:1em;height:1em;pointer-events:none;vertical-align:-.13em" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><image href="assets/pic-boat.png" width="32" height="32" preserveAspectRatio="xMidYMid meet"/></svg></g></g>`;return `<div class="diver-scene bridge-scene">${art(body,460,190)}</div>${hud([`Position : <b>${pos}</b>`,`Déplacements : <b>${d.history.length}/3</b>`,`Trésor : <b>${visited.includes(d.checkpoint)?'récupéré':'à trouver'}</b>`])}<div class="board-controls">${d.items.filter(item=>!d.history.includes(item.id)).map(item=>tool(`${item.n>0?'+':''}${item.n}`,'move',`data-i="${item.id}"`,'big')).join('')}</div><div class="game-board-note">${d.history.length?`${d.start} ${d.history.map(id=>{let n=d.items.find(i=>i.id===id).n;return`${n>=0?'+':'−'} ${Math.abs(n)}`}).join(' ')} = ${pos}`:'Choisis ton premier déplacement.'}</div><div class="board-controls">${tool('Annuler le dernier déplacement','undo')}${tool('Accoster au port','check','','selected')}</div>`},act(d,a,i){if(a==='move'){if(d.history.length<3)d.history.push(Number(i));else message('Tu as utilisé tes trois déplacements. Annule une action pour changer de stratégie.','error')}if(a==='undo')d.history.pop();if(a==='check'){let path=[d.start];for(const id of d.history)path.push(path.at(-1)+d.items.find(item=>item.id===id).n);if(d.history.length===3&&path.at(-1)===d.end&&path.slice(1,-1).includes(d.checkpoint))win(`Le sous-marin a visité ${path.join(' → ')}. L’ordre des déplacements compte pour ramasser le trésor, même quand deux chemins ont la même position finale.`);else message(!path.includes(d.checkpoint)?'Le trésor doit être récupéré en passant exactement par sa position.':path.at(-1)!==d.end?'Le trésor est récupéré, mais le sous-marin n’est pas encore au port.':'Vérifie les trois déplacements et le passage par le trésor avant l’arrivée.','error')}}});

engine('market',{cat:'m',title:'La boutique des explorateurs',mechanic:'Composer une monnaie',desc:'Prépare la monnaie exacte pour les voyageurs avec les pièces de ton comptoir.',grades:[1,2,3,4,5,6],topic:g=>g===1?'Euros et compléments':g<4?'Monnaie et calcul de différences':'Prix décimaux et monnaie à rendre',idea:'Le prix et la monnaie rendue doivent ensemble reconstituer la somme donnée. Les pièces peuvent se combiner de plusieurs façons.',create(g,l){let cents=g>=4,paid=cents?2000:1000,price=cents?rand(21,170)*10:rand(2,8)*100;return{paid,price,cents,coins:cents?[200,100,50,20,10]:[500,200,100],tray:[]}},goal:d=>`Le voyageur paie ${fmt(d.paid/100)} € pour un objet à ${fmt(d.price/100)} €. Prépare sa monnaie.`,instruction:()=> 'Ajoute des pièces au plateau. Touche une pièce posée pour la reprendre. Tu n’as pas besoin d’utiliser le moins de pièces.',render(d){return `<div class="shop-receipt"><span>Somme reçue <b>${fmt(d.paid/100)} €</b></span><span>Prix <b>${fmt(d.price/100)} €</b></span><span>À rendre <b>à toi de construire</b></span></div><div class="coin-tray">${d.tray.map((n,i)=>`<button class="money-coin" data-action="remove" data-i="${i}" aria-label="Reprendre la pièce de ${fmt(n/100)} euros">${fmt(n/100)}<small>€</small></button>`).join('')||'<span>Le plateau attend tes pièces</span>'}</div>${hud([`Sur le plateau : <b>${fmt(d.tray.reduce((a,b)=>a+b,0)/100)} €</b>`])}<div class="board-controls">${d.coins.map(n=>tool(`+ ${fmt(n/100)} €`,'coin',`data-i="${n}"`)).join('')}</div><div class="board-controls">${tool('Rendre la monnaie','check','','selected')}${tool('Vider le plateau','clear')}</div>`},act(d,a,i){if(a==='coin'&&d.tray.length<60)d.tray.push(Number(i));if(a==='remove')d.tray.splice(Number(i),1);if(a==='clear')d.tray=[];if(a==='check'){let sum=d.tray.reduce((a,b)=>a+b,0);if(sum+d.price===d.paid)win(`${fmt(d.price/100)} € + ${fmt(sum/100)} € = ${fmt(d.paid/100)} €. Les pièces de ton plateau rendent exactement la différence.`);else message(sum+d.price<d.paid?'Il manque encore de la monnaie sur le plateau.':'Tu rends trop de monnaie. Reprends ou remplace une pièce.','error')}}});
engine('clockwork',{cat:'m',title:'La gare des horloges',mechanic:'Régler les aiguilles',desc:'Règle la grande horloge pour faire partir le train à la bonne heure.',grades:[1,2,3,4,5,6],topic:g=>g===1?'Heures et demi-heures':'Heure, durées et passage à l’heure suivante',idea:'Une heure contient 60 minutes. La petite aiguille se déplace aussi quand les minutes avancent : à 3 h 30, elle est à mi-chemin entre 3 et 4.',create(g,l){let startH=rand(7,16),startM=g===1?0:choose([0,15,30,45]),duration=g===1?choose([30,60]):choose([25,35,45,70,85]),target=startH*60+startM+duration;return{startH,startM,duration,target,h:12,m:0,g}},goal:d=>`Le train part à ${d.startH} h ${String(d.startM).padStart(2,'0')} et voyage ${d.duration} minutes. Règle l’horloge de son arrivée.`,instruction:()=> 'Règle les heures et les minutes. L’affichage numérique t’aide à relier les deux représentations.',render(d){let body='<circle cx="160" cy="145" r="112" fill="#fff" stroke="#d7c5e8" stroke-width="5"/>';for(let i=1;i<=12;i++){let a=i*Math.PI/6;body+=`<text x="${160+90*Math.sin(a)}" y="${150-90*Math.cos(a)}" text-anchor="middle" font-size="15" fill="#9c83af">${i}</text>`}let ah=(d.h%12+d.m/60)*Math.PI/6,am=d.m*Math.PI/30;body+=`<path d="M160 145l${58*Math.sin(ah)} ${-58*Math.cos(ah)}" stroke="#a486c8" stroke-width="6" stroke-linecap="round"/><path d="M160 145l${83*Math.sin(am)} ${-83*Math.cos(am)}" stroke="#d3af73" stroke-width="4" stroke-linecap="round"/><circle cx="160" cy="145" r="7" fill="#b79bd2"/>`;return `<div class="clock-scene">${art(body,320,275)}</div>${slider('Heures','h',d.h,0,23)}${slider('Minutes','m',d.m,0,55,d.g===1?30:5)}${hud([`Mon horloge : <b>${d.h} h ${String(d.m).padStart(2,'0')}</b>`])}<div class="board-controls">${tool('Faire entrer le train','check','','selected')}</div>`},act(d,a){if(a==='check'){if(d.h*60+d.m===d.target)win(`${d.startH} h ${String(d.startM).padStart(2,'0')} + ${d.duration} min = ${Math.floor(d.target/60)} h ${String(d.target%60).padStart(2,'0')}. Chaque passage de 60 minutes avance l’heure d’une unité.`);else message('Le train n’arrive pas encore à l’heure indiquée. Avance d’abord jusqu’à l’heure suivante, puis ajoute les minutes restantes.','error')}}});
engine('domino',{cat:'c',title:'Le serpent des dominos',mechanic:'Relier & calculer',desc:'Relie toutes les pièces pour réveiller un serpent de nombres.',grades:[0,1,2,3],topic:g=>g===0?'Reconnaissance de petites quantités':g===1?'Petites additions':'Calcul mental et égalités',idea:'Deux extrémités peuvent se relier lorsqu’elles représentent le même nombre, même si l’une est écrite comme un calcul.',create(g,l){let count=g===0?3:4+l,values=Array.from({length:count+1},(_,i)=>i+(g===0?1:rand(2,3)));let tiles=[];for(let i=0;i<count;i++){let left=values[i],q=rand(0,left);tiles.push({id:i,left,right:values[i+1],label:g===0?String(left):`${q} + ${left-q}`})}return{start:values[0],end:values.at(-1),tiles:tiles.sort(()=>Math.random()-.5),chain:[],g}},goal:d=>`Construis un serpent de ${d.tiles.length} dominos, de ${d.start} jusqu’à ${d.end}.`,instruction:()=> 'Touche une pièce pour la relier à la chaîne. L’extrémité gauche doit valoir le nombre actuellement ouvert. Tu peux annuler si tu t’es engagé dans une impasse.',render(d){let current=d.chain.length?d.tiles.find(t=>t.id===d.chain.at(-1)).right:d.start;let pip=n=>`<span class="domino-pips">${Array.from({length:n},()=>'<i></i>').join('')}</span>`;return `${hud([`Départ : <b>${d.start}</b>`,`Extrémité ouverte : <b>${current}</b>`,`Arrivée : <b>${d.end}</b>`])}<div class="domino-chain">${d.chain.map(id=>{let t=d.tiles.find(t=>t.id===id);return `<span class="domino connected"><b>${t.label}</b><b>${t.right}</b></span>`}).join('')||'<span>Ton serpent commence ici</span>'}</div><div class="domino-bank">${d.tiles.filter(t=>!d.chain.includes(t.id)).map(t=>`<button class="domino" data-action="link" data-i="${t.id}" aria-label="Domino ${t.label} vers ${t.right}"><b>${d.g===0?pip(t.left):t.label}</b><b>${d.g===0?pip(t.right):t.right}</b></button>`).join('')}</div><div class="board-controls">${tool('Annuler le dernier domino','undo')}${tool('Réveiller le serpent','check','','selected')}</div>`},act(d,a,i){if(a==='link'){let t=d.tiles.find(t=>t.id===Number(i)),open=d.chain.length?d.tiles.find(t=>t.id===d.chain.at(-1)).right:d.start;if(t.left===open)d.chain.push(t.id);else message('Ces extrémités ne représentent pas le même nombre. Cherche une pièce compatible.','error')}if(a==='undo')d.chain.pop();if(a==='check'){if(d.chain.length===d.tiles.length)win(`Le serpent relie ${d.start} à ${d.end}. Chaque connexion repose sur une égalité et toutes les pièces ont été utilisées.`);else message('Le serpent a besoin de toutes ses pièces pour se réveiller.','error')}}});
engine('memory',{cat:'c',title:'Le jardin des paires',mechanic:'Mémoriser & associer',desc:'Retourne les cartes pour retrouver les calculs et leurs résultats.',grades:[1,2,3,4,5,6],topic:g=>g===1?'Doubles et petites additions':'Tables de multiplication et automatismes',idea:'Mémorise la place des cartes, mais aussi le sens des calculs. Deux calculs différents peuvent donner le même résultat ; ici chaque paire possède un résultat distinct.',create(g,l){let n=3+l,products=new Set(),pairs=[];while(pairs.length<n){let a=rand(2,9),b=rand(2,g===1?5:9),v=g===1?a+b:a*b;if(products.has(v))continue;products.add(v);pairs.push({calc:`${a} ${g===1?'+':'×'} ${b}`,v})}let cards=pairs.flatMap((p,i)=>[{pair:i,text:p.calc},{pair:i,text:String(p.v)}]).sort(()=>Math.random()-.5);return{cards,open:[],matched:[],turns:0}},goal:d=>`Retrouve les ${d.cards.length/2} paires pour faire fleurir le jardin.`,instruction:()=> 'Retourne deux cartes. Une opération et son résultat forment une paire. Après deux cartes différentes, touche une autre carte pour continuer. Il n’y a pas de chrono.',render(d){return `${hud([`Paires : <b>${d.matched.length}/${d.cards.length/2}</b>`,`Essais : <b>${d.turns}</b>`])}<div class="memory-grid">${d.cards.map((c,i)=>{let found=d.matched.includes(c.pair),face=found||d.open.includes(i);return `<button class="memory-card ${found?'matched':face?'revealed':''}" data-action="flip" data-i="${i}" ${found?'disabled':''} aria-label="${face?esc(c.text):'Carte cachée '+(i+1)}">${face?esc(c.text):'<span class="card-back">'+icon('star',22)+'</span>'}</button>`}).join('')}</div>${d.matched.length===d.cards.length/2?`<div class="board-controls">${tool('Admirer le jardin','check','','selected')}</div>`:''}`},act(d,a,i){i=Number(i);if(a==='flip'){if(d.matched.includes(d.cards[i].pair))return;if(d.open.length===2)d.open=[];if(d.open.includes(i))return;d.open.push(i);if(d.open.length===2){d.turns++;let[a,b]=d.open;if(d.cards[a].pair===d.cards[b].pair){d.matched.push(d.cards[a].pair);d.open=[];message('Une nouvelle fleur ! La paire est complète.','good')}}}if(a==='check'&&d.matched.length===d.cards.length/2)win(`Tu as retrouvé ${d.matched.length} paires en ${d.turns} essais, à ton rythme. Une opération est maintenant reliée à son résultat dans ta mémoire.`)}});
function rotatePiece(cells,turns){let pts=cells.map(p=>p.slice());for(let n=0;n<turns;n++)pts=pts.map(([x,y])=>[-y,x]);let minX=Math.min(...pts.map(p=>p[0])),minY=Math.min(...pts.map(p=>p[1]));return pts.map(([x,y])=>[x-minX,y-minY])}
engine('tangram',{cat:'g',title:'Le coffre des pavages',mechanic:'Tourner & emboîter',desc:'Tourne les pièces en L et remplis un coffre sans trou ni chevauchement.',grades:[0,1,2,3,4,5,6],topic:g=>g<2?'Formes, assemblages et orientation':'Pavage et rotations de pièces',idea:'Une rotation change l’orientation d’une pièce, mais conserve sa forme et son aire. Commence par observer les coins et les bords du coffre.',create(g,l){let w=g===0?3:6,h=g<2?2:l===1?2:4,n=w*h/3;return{w,h,n,cells:Array(w*h).fill(-1),placed:{},selected:0,turn:0,shape:[[0,0],[0,1],[1,1]]}},goal:d=>`Remplis le coffre avec les ${d.n} pièces en L. Aucune case ne doit rester vide.`,instruction:()=> 'Choisis une pièce, tourne-la, puis touche la case qui accueillera son coin supérieur gauche. Touche une pièce placée pour la reprendre.',render(d){let pts=rotatePiece(d.shape,d.turn);return `<div class="piece-workbench"><div><div class="paint-grid" style="grid-template-columns:repeat(${d.w},1fr);max-width:${d.w===3?240:390}px">${d.cells.map((v,i)=>`<button class="paint-cell ${v>=0?'tile-placed':''}" style="${v>=0?'background:'+['#a991d0','#e1bb7d','#91b8a3','#cba1ba'][v%4]+';border-color:#fff':''}" data-action="place" data-i="${i}" aria-label="Case ${i%d.w+1}, ${Math.floor(i/d.w)+1}${v>=0?', pièce '+(v+1):', vide'}">${v>=0?`<span style="font-size:10px;color:white">${v+1}</span>`:''}</button>`).join('')}</div></div><div class="piece-tools"><div class="piece-preview">${art(pts.map(([x,y])=>`<rect x="${20+x*35}" y="${15+y*35}" width="31" height="31" rx="5" fill="#ad94d2"/>`).join(''),120,100)}</div>${tool('Tourner de 90°','rotate')}<div class="piece-palette">${Array.from({length:d.n},(_,i)=>`<button class="tool ${d.selected===i?'selected':''}" data-action="select" data-i="${i}" ${d.placed[i]?'disabled':''}>${i+1}</button>`).join('')}</div></div></div>${hud([`Pièces placées : <b>${Object.keys(d.placed).length}/${d.n}</b>`])}<div class="board-controls">${tool('Ouvrir le coffre','check','','selected')}${tool('Tout reprendre','clear')}</div>`},act(d,a,i){i=Number(i);if(a==='rotate')d.turn=(d.turn+1)%4;if(a==='select')d.selected=i;if(a==='clear'){d.cells.fill(-1);d.placed={};d.selected=0}if(a==='place'){if(d.cells[i]>=0){let id=d.cells[i];d.cells=d.cells.map(v=>v===id?-1:v);delete d.placed[id];d.selected=id}else{if(d.placed[d.selected]){message('Choisis une pièce encore disponible.','error');return}let x=i%d.w,y=Math.floor(i/d.w),coords=rotatePiece(d.shape,d.turn).map(([dx,dy])=>[x+dx,y+dy]);if(coords.some(([X,Y])=>X>=d.w||Y>=d.h||d.cells[Y*d.w+X]>=0)){message('La pièce dépasse du coffre ou touche une autre pièce. Tourne-la, ou change de position.','error');return}coords.forEach(([X,Y])=>d.cells[Y*d.w+X]=d.selected);d.placed[d.selected]={x,y,turn:d.turn};d.selected=Array.from({length:d.n},(_,j)=>j).find(j=>!d.placed[j])??d.selected}}if(a==='check'){if(d.cells.every(v=>v>=0)&&Object.keys(d.placed).length===d.n)win(`Le coffre est rempli par ${d.n} pièces de 3 cases : ${d.n} × 3 = ${d.w*d.h}. Tu as combiné les orientations sans modifier l’aire des pièces.`);else message('Le coffre ne s’ouvre que lorsque toutes les cases sont couvertes exactement une fois.','error')}}});
engine('pizza',{cat:'f',title:'La pizzeria des parts',mechanic:'Découper & servir',desc:'Découpe une pizza en parts égales et prépare la portion commandée.',grades:[2,3,4,5,6],topic:g=>g<4?'Fractions : parties d’un tout':'Fractions et écritures équivalentes',idea:'Le dénominateur dit en combien de parts égales l’unité est partagée. Le numérateur dit combien de ces parts sont prises.',create(g,l){let den=choose(g<4?[2,4]:[3,4,6,8]),num=rand(1,den-1);return{den,num,n:2,slices:[]}},goal:d=>`Sers ${rat(d.num,d.den)} de la pizza entière, avec des parts de même taille.`,instruction:()=> 'Choisis le nombre de parts, puis touche celles que tu veux servir. Plusieurs découpages peuvent représenter la même fraction.',render(d){let shapes='';for(let i=0;i<d.n;i++){let a=i*2*Math.PI/d.n-Math.PI/2,b=(i+1)*2*Math.PI/d.n-Math.PI/2,x1=150+95*Math.cos(a),y1=110+95*Math.sin(a),x2=150+95*Math.cos(b),y2=110+95*Math.sin(b);shapes+=`<path data-action="slice" data-i="${i}" tabindex="0" role="button" aria-label="${d.slices.includes(i)?'Retirer':'Servir'} la part ${i+1}" d="M150 110L${x1} ${y1}A95 95 0 ${b-a>Math.PI?1:0} 1 ${x2} ${y2}Z" fill="${d.slices.includes(i)?'#ac91d1':'#edce94'}" stroke="#fff7e8" stroke-width="3" style="cursor:pointer"/>`}return `<div class="pizza-scene">${art(shapes,300,220)}</div>${slider('Découpage','n',d.n,2,8)}${hud([`Part servie : <b>${rat(d.slices.length,d.n)}</b>`])}<div class="board-controls">${tool('Servir la commande','check','','selected')}${tool('Reprendre les parts','clear')}</div>`},act(d,a,i){i=Number(i);if(a==='slice'){if(d.slices.includes(i))d.slices=d.slices.filter(v=>v!==i);else d.slices.push(i)}if(a==='clear')d.slices=[];if(a==='check'){if(d.slices.length*d.den===d.num*d.n)win(`${d.slices.length}/${d.n} = ${rat(d.num,d.den)}. La portion servie respecte la commande, même si tu as choisi un autre découpage.`);else message('La portion violette ne correspond pas encore à la commande. Tu peux changer le nombre de parts ou ta sélection.','error')}},bind // Pixel v2 : la géométrie du trajet varie, pas seulement les cases de rochers.
function makeRobotLevel(g,l){
 const n=g===0?4:6;
 const loops=g>=4;
 const segmentCount=g===0?2:l===1?choose([2,3]):3;
 const start=[rand(0,n-1),rand(0,n-1)];
 const waypoints=[start.slice()];
 const safe=new Set([start.join(',')]);
 let pos=start.slice(),axis=rand(0,1);
 for(let segment=0;segment<segmentCount;segment++){
  const directions=[];
  if(pos[axis]>0)directions.push(-1);
  if(pos[axis]<n-1)directions.push(1);
  const sign=choose(directions);
  const maximum=sign>0?n-1-pos[axis]:pos[axis];
  const distance=rand(1,maximum);
  for(let step=0;step<distance;step++){
   pos=pos.slice();pos[axis]+=sign;safe.add(pos.join(','));
  }
  waypoints.push(pos.slice());axis=1-axis;
 }
 const end=waypoints.at(-1).slice();
 const gems=waypoints.slice(1,-1).map(p=>p.join(','));
 const candidates=[];
 for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(!safe.has(`${x},${y}`))candidates.push(`${x},${y}`);
 const density=g===0?.15:.21+l*.035;
 const walls=candidates.filter(()=>Math.random()<density);
 if(!walls.length&&candidates.length)walls.push(choose(candidates));
 return{n,start,end,pos:start.slice(),gems,walls,got:[],path:[],program:[],repeat:1,running:false,loops,budget:loops?3:20,generationVersion:2};
}
// Recherche indépendante : ni la solution ni le chemin réservé par le générateur
// ne sont fournis à cet algorithme. Il cherche dans les règles du vrai plateau.
function findRobotProgram(d){
 if(!d.start||!d.end||d.gems.length>8)return null;
 const obstacles=new Set(d.walls),all=(1<<d.gems.length)-1;
 const bit=new Map(d.gems.map((s,i)=>[s,1<<i]));
 const initialMask=bit.get(d.start.join(','))||0;
 const queue=[{x:d.start[0],y:d.start[1],mask:initialMask,program:[]}];
 const visited=new Set([`${d.start[0]},${d.start[1]},${initialMask}`]);
 const directions=[['R',1,0],['L',-1,0],['U',0,-1],['D',0,1]];
 for(let head=0;head<queue.length;head++){
  const current=queue[head];
  if(current.x===d.end[0]&&current.y===d.end[1]&&current.mask===all)return current.program;
  if(current.program.length>=d.budget)continue;
  for(const[dir,dx,dy]of directions){
   let x=current.x,y=current.y,mask=current.mask;
   for(let length=1;length<=(d.loops?d.n-1:1);length++){
    x+=dx;y+=dy;
    const position=`${x},${y}`;
    if(x<0||y<0||x>=d.n||y>=d.n||obstacles.has(position))break;
    mask|=bit.get(position)||0;
    const key=`${x},${y},${mask}`;
    if(visited.has(key))continue;
    visited.add(key);
    queue.push({x,y,mask,program:[...current.program,{dir,n:length}]});
   }
  }
 }
 return null;
}
function verifyRobotProgram(d,program){
 if(!Array.isArray(program)||program.length>d.budget)return false;
 let [x,y]=d.start,got=new Set();
 const blocks=new Set(d.walls);
 if(d.gems.includes(`${x},${y}`))got.add(`${x},${y}`);
 for(const command of program){
  const delta={R:[1,0],L:[-1,0],U:[0,-1],D:[0,1]}[command.dir];
  if(!delta||!Number.isInteger(command.n)||command.n<1||command.n>(d.loops?d.n:1))return false;
  for(let i=0;i<command.n;i++){
   x+=delta[0];y+=delta[1];const p=`${x},${y}`;
   if(x<0||y<0||x>=d.n||y>=d.n||blocks.has(p))return false;
   if(d.gems.includes(p))got.add(p);
  }
 }
 return x===d.end[0]&&y===d.end[1]&&got.size===d.gems.length;
}
engines.robot.create=makeRobotLevel;
engines.robot.instruction=d=>`Programme le trajet jusqu’au portail en passant par ${d.gems.length===1?'le cristal':'tous les cristaux'}.${d.loops?' La limite est de 3 blocs : un bloc peut avancer de plusieurs cases. Le menu « Répéter » règle seulement la prochaine flèche ajoutée.':''} Les rochers bloquent le passage.`;
const originalRobotBinding=engines.robot.bind;
engines.robot.bind=function(d){
 originalRobotBinding?.(d);
 document.querySelectorAll('[data-command-repeat]').forEach(select=>{
  select.onchange=()=>{
   if(d.running||game?.won)return;

 });
};

oke-width="9" stroke-linecap="round"/>';else if(id==='blocks')body=Array.from({length:3},(_,i)=>`<rect x="${75+i*21}" y="38" width="12" height="76" rx="4" fill="${gold}"/>`).join('')+Array.from({length:4},(_,i)=>`<rect x="${154+i%2*22}" y="${65+Math.floor(i/2)*24}" width="17" height="17" rx="4" fill="${purple}"/>`).join('');else if(id==='factory')body=Array.from({length:15},(_,i)=>`<rect x="${71+i%5*25}" y="${38+Math.floor(i/5)*27}" width="20" height="21" rx="5" fill="${purple}"/><circle cx="${77+i%5*25}" cy="${46+Math.floor(i/5)*27}" r="2" fill="#fff"/><circle cx="${84+i%5*25}" cy="${46+Math.floor(i/5)*27}" r="2" fill="#fff"/>`).join('');else if(id==='share')body=[0,1,2].map(i=>`<path d="M${49+i*65} 65h50l-7 35h-36Z" fill="${purple}"/>${[0,1,2].map(j=>`<circle cx="${60+i*65+j*13}" cy="57" r="7" fill="${gold}"/>`).join('')}`).join('');else if(id==='fractions'||id==='bars')body=`<rect x="45" y="48" width="170" height="25" rx="4" fill="#dcd0eb"/><rect x="45" y="81" width="75" height="25" rx="4" fill="${purple}"/><rect x="125" y="81" width="90" height="25" rx="4" fill="${gold}"/><text x="130" y="67" text-anchor="middle" font-size="14" fill="#8a70a5">${id==='fractions'?'1 unité':'le tout'}</text><text x="82" y="99" text-anchor="middle" font-size="13" fill="#fff">${id==='fractions'?'½':'7'}</text><text x="170" y="99" text-anchor="middle" font-size="13" fill="#a27c3b">?</text>`;else if(id==='garden'||id==='mosaic'||id==='robot'){body=Array.from({length:28},(_,i)=>`<rect x="${55+i%7*23}" y="${27+Math.floor(i/7)*24}" width="19" height="20" rx="4" fill="${id==='garden'?(i%7>1&&i%7<6?green:'#fff9'):id==='mosaic'?(i%3===0?purple:i%5===0?gold:'#fff9'):'#fff9'}"/>`).join('');if(id==='robot')body+='<g transform="translate(82 103)"><g transform="translate(0 -24.65) scale(0.90625)" style="font-size:32px"><svg class="pictogram pictogram-robot" style="width:1em;height:1em;pointer-events:none;vertical-align:-.13em" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><image href="assets/pic-robot.png" width="32" height="32" preserveAspectRatio="xMidYMid meet"/></svg></g></g><g transform="translate(169 51)"><g transform="translate(0 -19.55) scale(0.71875)" style="font-size:32px"><svg class="pictogram pictogram-gem" style="width:1em;height:1em;pointer-events:none;vertical-align:-.13em" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><image href="assets/pic-gem.png" width="32" height="32" preserveAspectRatio="xMidYMid meet"/></svg></g></g>'}else if(id==='balance')body=`<path d="M65 99h130m-65 0v25" stroke="${stroke}" stroke-width="6" stroke-linecap="round"/><path d="M78 87h35m37 0h35" stroke="#c2acd9" stroke-width="4"/><rect x="82" y="45" width="28" height="37" rx="6" fill="${purple}"/><text x="96" y="71" text-anchor="middle" fill="#fff" font-size="23">x</text>${Array.from({length:6},(_,i)=>`<rect x="${150+i%3*14}" y="${51+Math.floor(i/3)*17}" width="12" height="13" rx="2" fill="${gold}"/>`).join('')}`;else if(id==='kitchen')body=[0,1,2].map(i=>`<path d="M${60+i*55} 40v64q18 15 36 0V40" fill="#fff9" stroke="#c8b2dc" stroke-width="2"/><path d="M${62+i*55} ${60+i*10}v42q16 12 32 0V${60+i*10}Z" fill="${[purple,gold,green][i]}"/>`).join('');else if(id==='towers')body=[3,5,4,2].map((n,i)=>Array.from({length:n},(_,j)=>`<rect x="${64+i*38}" y="${112-j*16}" width="27" height="12" rx="3" fill="${i%2?gold:purple}"/>`).join('')).join('');else if(id==='chance')body=`<path d="M85 39v61q45 50 90 0V39" fill="#e2d5ee" stroke="#b8a1cf" stroke-width="3"/>${Array.from({length:12},(_,i)=>`<circle cx="${100+i%4*21}" cy="${60+Math.floor(i/4)*20}" r="8" fill="${i%3?purple:gold}"/>`).join('')}`;else if(id==='constellation')body=`<path d="M45 108h175M125 20v115" stroke="#c9b6dd"/><path d="M55 116 203 30" stroke="${purple}" stroke-width="3"/>${[0,1,2].map(i=>`<circle cx="${85+i*43}" cy="${99-i*25}" r="7" fill="${gold}" stroke="#c7a05a"/>`).join('')}`;else if(id==='primes')body=`<rect x="105" y="23" width="50" height="40" rx="9" fill="${purple}"/><text x="130" y="50" text-anchor="middle" fill="#fff" font-size="21">30</text><path d="m130 64-45 22m45-22 45 22" stroke="#c5b1db" stroke-width="2"/>${[[65,'2'],[109,'3'],[153,'5']].map(([x,n])=>`<rect x="${x}" y="85" width="38" height="35" rx="8" fill="${green}"/><text x="${x+19}" y="110" text-anchor="middle" fill="#fff" font-size="21">${n}</text>`).join('')}`;else if(id==='ladder')body=`<path d="M55 115h150V34Z" fill="#e0d2ef" stroke="#bba0d4" stroke-width="2"/><path d="M55 115 205 34" stroke="${purple}" stroke-width="8" stroke-linecap="round"/><path d="M190 115v-15h15" stroke="#af94c8" fill="none"/><text x="136" y="61" font-size="22" fill="#b69a5d">?</text>`;return art(body,260,145)}
function home(){state.page='home';header();$('#view').innerHTML=`<div class="intro"><div><div class="eyebrow">Un cahier de jeux, de la GS à la 3e</div><h1>On commence par quoi ? <span style="color:#cf4a3c"><svg class="pictogram pictogram-burst" style="width:1em;height:1em;pointer-events:none;vertical-align:-.13em" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><image href="assets/pic-burst.png" width="32" height="32" preserveAspectRatio="xMidYMid meet"/></svg></span></h1><p>Ici on manipule, on essaie, on recommence. On ne coche pas des cases.</p></div><label class="level-control"><span class="level-icon">${icon('cap',19)}</span><span><small>MON NIVEAU</small><select id="gradeSelect" aria-label="Choisir ma classe">${gradeNames.map((n,i)=>`<option value="${i}" ${i===state.grade?'selected':''}>${n}</option>`).join('')}</select></span></label></div><div class="hero-row"><section class="hero"><div class="hero-copy"><span class="tag"><svg class="pictogram pictogram-sparkles" style="width:1em;height:1em;pointer-events:none;vertical-align:-.13em" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><image href="assets/pic-sparkles.png" width="32" height="32" preserveAspectRatio="xMidYMid meet"/></svg> d’abord avec les mains</span><h2>Des ponts, des robots,<br>des nombres à démonter.</h2><p>Trente ateliers où l’on construit, casse et reconstruit. Pas de chrono, pas de questionnaire : tu avances comme tu veux.</p><button class="primary" id="explore">Ouvrir le cahier ${icon('arrow',15)}</button></div>${heroGraphic}</section><section class="daily"><div class="daily-top"><div class="daily-icon">${icon('book',20)}</div><span class="badge">d’où viennent ces jeux</span></div><h3>Le bon atelier, au bon moment.</h3><p>${state.grade<6?'D’abord les objets et les images ; les symboles viennent après.':'Des constructions et des stratégies, reliées aux chapitres du collège.'}</p><button id="refs">Voir les références utilisées ${icon('arrow',14)}</button></section></div><section><div class="section-head"><div><h2>Choisis ta classe.</h2><p>Le même jeu change avec les notions, pas seulement avec les nombres.</p></div><span class="micro">30 ateliers · 6 missions chacun</span></div><div class="grade-tabs" aria-label="Classes">${grades.map((n,i)=>`<button class="grade-tab ${i===state.grade?'active':''}" data-grade="${i}" aria-pressed="${i===state.grade}">${n}</button>`).join('')}</div></section><section id="catalog"><div class="catalog-head"><h2>Les ateliers de ta classe</h2><label class="search">${icon('search',15)}<input id="search" aria-label="Rechercher un jeu ou une notion" placeholder="Jeu, notion, sujet…" value="${esc(state.search)}"></label></div><div class="filters"></div><div class="cards" id="cards"></div></section><div class="bottom-note">${icon('shield',13)} Pas de chrono, pas de questionnaire, pas de compte. Tes aventures restent dans ce navigateur.</div>`;$('#gradeSelect').onchange=e=>gradeChange(e.target.value);document.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>gradeChange(b.dataset.grade));$('#search').oninput=e=>{state.search=e.target.value;cards()};$('#explore').onclick=()=>openGame(journeys[state.grade][state.grade<2?0:state.grade<4?3:state.grade<7?4:0]);$('#refs').onclick=()=>navigate('about');filters();cards()}
function filters(){const available=new Set(journeys[state.grade].map(id=>engines[id].cat));$('.filters').innerHTML=[['all','Tous les jeux'],...Object.entries(cats).filter(([id])=>available.has(id)).map(([id,c])=>[id,c.name])].map(([id,name])=>`<button class="filter ${state.filter===id?'active':''}" data-filter="${id}" aria-pressed="${state.filter===id}"><span class="dot"></span>${name}</button>`).join('');document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;filters();cards()})}
function cards(){const query=state.search.toLocaleLowerCase('fr');const ids=journeys[state.grade].filter(id=>{const e=engines[id];return(state.filter==='all'||e.cat===state.filter)&&`${e.title} ${e.desc} ${e.topic(state.grade)} ${cats[e.cat].name}`.toLocaleLowerCase('fr').includes(query)});$('#cards').innerHTML=ids.length?ids.map(id=>{let e=engines[id],c=cats[e.cat],rec=record(id);return `<article class="card game-card"><div class="game-cover" style="--tint:${c.tint};--ink:${c.ink}"><span class="mechanic">${e.mechanic}</span>${rec.won.length?`<span class="game-stars" aria-label="${rec.won.length} missions réussies">${'<svg class="pictogram pictogram-star" style="width:1em;height:1em;pointer-events:none;vertical-align:-.13em" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><image href="assets/pic-star.png" width="32" height="32" preserveAspectRatio="xMidYMid meet"/></svg>'.repeat(rec.won.length)}</span>`:''}${preview(id)}</div><div class="game-card-body"><h3>${e.title}</h3><p>${e.desc}</p><div class="source-chip">${grades[state.grade]} · ${e.topic(state.grade)}</div><div class="card-bottom"><span class="card-meta">${rec.won.length?`${rec.won.length}/6 missions réussies`:'6 missions à explorer'}</span><button class="play-btn" data-play="${id}" aria-label="Jouer à ${e.title}">Jouer ${icon('arrow',12)}</button></div></div></article>`}).join(''):'<div class="empty">Aucun jeu ne correspond à cette recherche dans cette classe.<br>Essaie une autre notion ou une autre classe.</div>';document.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>openGame(b.dataset.play))}
function openGame(id,level=1){state.page='game';const table=id==='factory'&&game?.id===id?game.table:0;game={id,level,table,token:Math.random(),won:false,message:'Tu peux essayer, observer, recommencer. Les erreurs ne retirent pas d’étoile.',messageType:'',hint:false};const e=engines[id];game.data=e.create(state.grade,level);e.init?.(game.data);header();renderGame();window.scrollTo({top:0,behavior:'instant'})}
function renderGame(){const e=engines[game.id],rec=record(game.id);$('#view').innerHTML=`<div class="arcade"><button class="back" id="backGames">${icon('back',14)} Retour aux aventures</button><div class="arcade-head"><div><div class="eyebrow">${grades[state.grade]} · ${cats[e.cat].name}</div><h1>${e.title}</h1><p>${e.mechanic} · ${e.topic(state.grade)}</p></div><div class="mission-tabs" aria-label="Choisir une mission">${[1,2,3,4,5,6].map(l=>`<button class="${l===game.level?'on':''} ${rec.won.includes(l)?'won':''}" data-mission="${l}" aria-label="Mission ${l}${rec.won.includes(l)?', déjà réussie':''}">${rec.won.includes(l)?'<svg class="pictogram pictogram-star" style="width:1em;height:1em;pointer-events:none;vertical-align:-.13em" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><image href="assets/pic-star.png" width="32" height="32" preserveAspectRatio="xMidYMid meet"/></svg>':l}</button>`).join('')}</div></div>${game.id==='factory'?`<label class="level-control" style="max-width:290px;margin-bottom:14px"><span><small>TABLE À EXPLORER</small><select id="tableSelect" aria-label="Choisir la table"><option value="0">Tables du niveau</option>${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${game.table===i+1?'selected':''}>Table de ${i+1}</option>`).join('')}</select></span></label>`:''}<div class="arena"><div class="arena-mission"><div class="mission-emblem"><svg class="pictogram pictogram-flag" style="width:1em;height:1em;pointer-events:none;vertical-align:-.13em" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><image href="assets/pic-flag.png" width="32" height="32" preserveAspectRatio="xMidYMid meet"/></svg></div><div><h2 id="missionGoal">${e.goal(game.data)}</h2><p>${e.instruction(game.data)}</p></div></div><div class="board" id="board"></div><div id="gameStatus" class="game-status"></div><div id="victory"></div></div><div class="arena-footer"><button class="hint-btn" id="ideaBtn">${icon('bulb',15)} Une idée pour avancer</button><button class="back" id="restart">${icon('back',13)} Recommencer cette mission</button></div><div id="idea"></div><div class="pedagogy"><strong>Repère :</strong> ${refText(state.grade)}. Adaptation ludique originale, non officielle. <button class="ref-inline" id="gameRefs">Détail des sources et limites</button></div></div>`;$('#backGames').onclick=()=>navigate('home');$('#restart').onclick=()=>openGame(game.id,game.level);document.querySelectorAll('[data-mission]').forEach(b=>b.onclick=()=>openGame(game.id,Number(b.dataset.mission)));$('#ideaBtn').onclick=()=>{game.hint=true;$('#idea').innerHTML=`<div class="idea">${icon('bulb',16)} ${e.idea}</div>`};$('#gameRefs').onclick=()=>navigate('about');if($('#tableSelect'))$('#tableSelect').onchange=ev=>{game.table=Number(ev.target.value);openGame(game.id,game.level)};renderBoard()}
function renderBoard(){if(!game||state.page!=='game')return;const e=engines[game.id];$('#board').innerHTML=`<div class="board-inner">${e.render(game.data)}</div>`;$('#board').inert=game.won;$('#board').querySelectorAll('[data-action]').forEach(b=>b.onclick=ev=>{if(game.won)return;const el=ev.currentTarget;if(el.dataset.suppress==='true'){delete el.dataset.suppress;return}game.messageType='';e.act(game.data,el.dataset.action,el.dataset.i,el);if(game)renderBoard()});$('#board').querySelectorAll('[data-slider]').forEach(input=>{input.oninput=()=>{const value=Number(input.value);game.data[input.dataset.slider]=value;if(game.id==='pizza'&&input.dataset.slider==='n')game.data.slices=[];game.messageType='';/* Garder le curseur actif pendant un déplacement tactile. */input.closest('label').querySelector('output').textContent=fmt(value)+(input.dataset.slider==='length'?' m':input.dataset.slider==='aim'?'°':'');updateLivePreview()};input.onchange=()=>renderBoard()});e.bind?.(game.data);message(game.message,game.messageType);const victory=$('#victory');if(game.won){victory.innerHTML=`<div class="game-victory sparkle"><span class="win-star"><svg class="pictogram pictogram-star" style="width:1em;height:1em;pointer-events:none;vertical-align:-.13em" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><image href="assets/pic-star.png" width="32" height="32" preserveAspectRatio="xMidYMid meet"/></svg></span><h3>${choose(['Mission accomplie !','Bien joué, architecte !','Un vrai beau déclic !'])}</h3><p>${game.summary}</p>${game.extra||''}<button class="primary" id="nextMission">${game.level<6?'Mission suivante':'Rejouer avec une nouvelle mission'} ${icon('arrow',15)}</button></div>`;$('#nextMission').onclick=()=>openGame(game.id,game.level<6?game.level+1:1);document.querySelectorAll('[data-mission]').forEach(b=>b.classList.toggle('won',record(game.id).won.includes(Number(b.dataset.mission))));}else victory.innerHTML='';bindPaint()}
function updateLivePreview(){const active=document.activeElement,key=active?.dataset.slider;if(!key)return;const e=engines[game.id];const temp=document.createElement('div');temp.innerHTML=e.render(game.data);const board=$('#board .board-inner');/* Ne remplacer que les scènes, pas le contrôle qui est en cours d'utilisation. */for(const selector of ['.bar-container','.factory-board','.graph-wrap','.balance-expression','.graph-targets','.bridge-scene','.clock-scene','.pizza-scene','.hud']){const old=board.querySelector(selector),fresh=temp.querySelector(selector);if(old&&fresh)old.replaceWith(fresh)} }
function bindPaint(){if(!['garden','mosaic'].includes(game.id))return;const board=$('#board');board.onpointerdown=ev=>{const cell=ev.target.closest('[data-action="paint"],[data-action="pixel"]');if(!cell||game.won||ev.button>0)return;paintDrag={pointer:ev.pointerId,last:cell.dataset.i,value:game.id==='garden'?!game.data.cells[cell.dataset.i]:game.data.color,moved:false,start:Number(cell.dataset.i)};};board.onpointermove=ev=>{if(!paintDrag||!ev.buttons)return;const target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('[data-action="paint"],[data-action="pixel"]');if(!target||target.disabled||target.dataset.i===paintDrag.last)return;paintDrag.moved=true;paintDrag.last=target.dataset.i;game.data.cells[paintDrag.start]=paintDrag.value;game.data.cells[target.dataset.i]=paintDrag.value;if(game.id==='garden'){board.querySelector(`[data-i="${paintDrag.start}"][data-action="paint"]`)?.classList.toggle('filled',paintDrag.value);target.classList.toggle('filled',paintDrag.value)}else{for(const i of [paintDrag.start,target.dataset.i]){const c=board.querySelector(`[data-i="${i}"][data-action="pixel"]`);if(c)c.className=`paint-cell pixel-${paintDrag.value}`}}};board.onpointerup=()=>{if(paintDrag?.moved){paintDrag=null;renderBoard()}else paintDrag=null};board.onpointerleave=()=>{if(paintDrag?.moved){paintDrag=null;renderBoard()}}}
function progressPage(){const entries=Object.entries(state.progress).filter(([k])=>engines[k.split(':')[1]]),won=entries.reduce((a,[,r])=>a+r.won.length,0);$('#view').innerHTML=`<div class="intro"><div><div class="eyebrow">ce que tu as déjà fait</div><h1>Mes aventures.</h1><p>Chaque étoile correspond à une mission réellement accomplie.</p></div></div><div class="progress-layout"><div class="stat"><span>Étoiles gagnées</span><strong>${state.stars} <svg class="pictogram pictogram-star" style="width:1em;height:1em;pointer-events:none;vertical-align:-.13em" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><image href="assets/pic-star.png" width="32" height="32" preserveAspectRatio="xMidYMid meet"/></svg></strong></div><div class="stat"><span>Missions découvertes</span><strong>${won}</strong></div><div class="stat"><span>Jeux explorés</span><strong>${entries.length}</strong></div></div><div class="progress-list">${entries.length?entries.map(([key,r])=>{const[g,id]=key.split(':'),e=engines[id];return `<div class="progress-item"><div class="detail"><h3>${e.title} · ${grades[g]}</h3><p>${r.won.length}/6 missions réussies · ${r.plays} réussite${r.plays>1?'s':''} au total</p><div class="bar"><i style="width:${r.won.length/6*100}%"></i></div></div><span style="color:#c09c53;letter-spacing:2px">${'<svg class="pictogram pictogram-star" style="width:1em;height:1em;pointer-events:none;vertical-align:-.13em" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><image href="assets/pic-star.png" width="32" height="32" preserveAspectRatio="xMidYMid meet"/></svg>'.repeat(r.won.length)}</span><button class="play-btn" data-resume="${key}">Continuer ${icon('arrow',13)}</button></div>`}).join(''):'<div class="empty">Aucune mission terminée pour le moment.<br>À toi de construire ta première aventure !<br><button class="primary" id="firstAdventure" style="margin-top:17px">Trouver mon jeu</button></div>'}</div><div class="notice">Une étoile récompense une construction ou une stratégie qui fonctionne. Ce n’est ni une note, ni une certification de maîtrise scolaire.</div><div class="bottom-note">${icon('shield',13)} ${storageOK?'Sauvegarde locale uniquement, sans compte.':'Stockage indisponible : les aventures sont conservées pendant cette visite seulement.'}</div>${entries.length?'<button class="back" id="resetProgress" style="margin-top:25px">Effacer mon carnet d’aventures</button>':''}`;document.querySelectorAll('[data-resume]').forEach(b=>b.onclick=()=>{const[g,id]=b.dataset.resume.split(':');state.grade=Number(g);save();const next=[1,2,3,4,5,6].find(l=>!record(id).won.includes(l))||6;openGame(id,next)});if($('#firstAdventure'))$('#firstAdventure').onclick=()=>navigate('home');if($('#resetProgress'))$('#resetProgress').onclick=()=>{if(confirm('Effacer toutes les missions et étoiles de cette version ?')){state.progress={};state.stars=0;save();header();progressPage()}}}

function referencesPage(){$('#view').innerHTML=`<div class="intro"><div><div class="eyebrow">d’où viennent les niveaux</div><h1>Des jeux. Des repères clairs.</h1><p>Références consultées le 31 octobre 2026 · adaptation indépendante.</p></div></div><div class="reference-grid"><section class="reference-card"><h2>À l’école : manipuler → représenter → symboliser</h2><p>Les présentations de la méthode de Singapour mettent en avant la démarche concrète, imagée et abstraite ainsi que le modèle en barres. Le site en propose une transposition numérique : objets manipulables, quantités représentées, puis relation symbolique au bilan.</p><p>Une manipulation à l’écran ne remplace pas toutes les expériences avec du matériel réel. Ces jeux ne reproduisent ni le manuel ni une séquence complète de la méthode.</p></section><section class="reference-card"><h2>Au collège : suivre les chapitres consultés</h2><p>Le repérage utilise les sommaires iParcours : 6e 2025, 5e 2026, 4e et 3e 2022. Les fonctions sont bien présentes dans le sommaire de 5e 2026 : elles ne sont donc pas arbitrairement réservées à la 3e.</p><p>Les jeux de révision restent identifiés comme tels. Un chapitre figurant dans un manuel ne signifie pas que toutes ses compétences sont déjà couvertes par un jeu.</p></section></div><h2 style="font-size:18px;margin-top:28px">Correspondance de cette version</h2><table class="reference-table"><thead><tr><th>Classe</th><th>Exemples de notions effectivement jouées</th><th>Repère utilisé</th></tr></thead><tbody>${grades.map((g,i)=>`<tr><td><strong>${g}</strong></td><td>${[...new Set(journeys[i].map(id=>engines[id].topic(i)))].join(' · ')}</td><td>${i===0?'S1':i===1?'S2':i<=3?'S3':i<=5?'S4 / S5':i===6?'I6':i===7?'I5':i===8?'I4':'I3'}</td></tr>`).join('')}</tbody></table><div class="reference-card"><h2>Sources primaires consultées</h2><ul>${sources.map(([id,title,ed,url])=>`<li><strong>${id}</strong> · <a href="${url}" target="_blank" rel="noopener noreferrer">${title}</a> — ${ed}</li>`).join('')}</ul></div><div class="idea"><strong>Ce qui est vérifié, et ce qui ne l’est pas.</strong><br>Les présentations et sommaires accessibles permettent un repérage des sujets. Ils ne permettent pas d’affirmer une équivalence exercice par exercice, une calibration fine sur tous les livres, ou une conformité intégrale aux programmes. Les unités du primaire ont été repérées à partir des présentations et non d’une lecture intégrale de chaque manuel. Une validation enseignante reste nécessaire. Aucun partenariat ni agrément des éditeurs n’est revendiqué.</div><p class="ref-note">Cette version contient 30 mécaniques de manipulation, pas une couverture exhaustive de toutes les notions de la GS à la 3e. Les grandeurs non encore jouables, certaines opérations sur les fractions et d’autres chapitres restent à développer. Les contenus et illustrations des jeux sont originaux.</p><button class="primary" id="backExplore">Revenir aux jeux ${icon('arrow',14)}</button>`;$('#backExplore').onclick=()=>navigate('home')}

function proofFor(id,d,g){
 const out=(patch,hint,valid=true)=>({valid,patch,hint});
 switch(id){
 case 'orchard':return out({count:d.target},`Complète le panier jusqu’à ${d.target}.`,d.target<=40&&d.start<=d.target);
 case 'blocks':{let counts=d.weights.map((w,i)=>Math.floor(d.target/w)%(i===0?10000000:10));return out({counts},'Lis les chiffres de gauche à droite : chaque chiffre donne le nombre de pièces de son rang.',counts.every(n=>n<=20)&&counts.reduce((s,n,i)=>s+n*d.weights[i],0)===d.target)}
 case 'bars':return out({value:d.target-d.known},`Le tout moins la partie connue donne la longueur manquante.`,d.target>d.known);
 case 'factory':return out({r:d.rows,c:d.cols},`Garde ${d.rows} rangées et partage ${d.rows*d.cols} robots entre elles.`,d.rows>=1&&d.rows<=12&&d.cols>=1&&d.cols<=12);
 case 'share':return out({bowls:Array(d.n).fill(d.total/d.n)},'Distribue un biscuit à chacun, puis recommence un tour jusqu’à vider la réserve.',d.total%d.n===0);
 case 'fractions':{let found=null;function find(sum,arr){if(sum===d.target&&arr.length>=2){found=arr;return true}if(arr.length>=18||sum>=d.target)return false;for(let den of d.denom)if(find(sum+d.unit/den,[...arr,den]))return true;return false}find(0,[]);return out({placed:found||[]},'Utilise un dénominateur commun pour comparer la longueur des morceaux à la rive.',!!found)}
 case 'garden':{let cells=Array(d.n*d.n).fill(false);for(let y=0;y<d.h;y++)for(let x=0;x<d.w;x++)cells[y*d.n+x]=true;return out({cells},'Un rectangle de '+d.w+' cases sur '+d.h+' cases respecte les contraintes.',d.w<=d.n&&d.h<=d.n&&d.w*d.h===d.area&&2*(d.w+d.h)===d.perimeter)}
 case 'mosaic':return out({cells:d.target.slice()},'Transforme chaque case du modèle séparément, en conservant sa couleur.',d.target.length===d.n*d.n);
 case 'robot':{const program=findRobotProgram(d);return out({program:program||[],pos:d.start.slice(),path:[],got:[],running:false},'Le départ, les cristaux et le portail changent de place. Cherche les changements de direction et regroupe les cases parcourues dans une même direction.',!!program&&verifyRobotProgram(d,program))}
 case 'balance':return out({a:1,b:0,c:0,d:d.x,history:['Construction montrée avec l’aide : x isolé.'],past:[]},'Retire les unités des deux côtés. Retire les boîtes communes, puis divise pour ne garder qu’une boîte.',same(d.a*d.x+d.b,d.c*d.x+d.d));
 case 'kitchen':return out({amount:d.per.map(n=>n*d.to)},'Passe par une personne, puis multiplie chaque ingrédient par le nombre de personnes demandé.',d.per.every(n=>n*d.to<=1000&&(n*d.to)%10===0));
 case 'towers':return out({heights:Array(4).fill(d.mean),selected:null},'Déplace les étages des grandes tours vers les petites ; le total doit rester constant.',d.heights.reduce((a,b)=>a+b,0)===d.mean*4);
 case 'chance':{let p=d.total*d.n/d.den;return out({p,y:d.total-p},'Calcule la fraction du nombre total de billes qui doit être violette.',Number.isInteger(p)&&d.total<=36)}
 case 'constellation':return out({A:d.a,B:d.b},'La balise d’abscisse 0 donne le décalage b. Les autres donnent la pente.',d.a>=-3&&d.a<=3&&d.b>=-5&&d.b<=5);
 case 'primes':{let n=d.total,nodes=[];for(let p of[2,3,5,7,11,13])while(n%p===0){nodes.push(p);n/=p}return out({nodes,selected:0},'Commence par tester la divisibilité par 2, puis 3, puis 5 et 7.',n===1)}
 case 'ladder':return out({length:d.c},'Additionne les carrés des deux longueurs connues, puis cherche leur racine carrée.',d.a*d.a+d.b*d.b===d.c*d.c&&d.c<=25);
 case 'radar':return out({aim:d.angle},'Choisis le rapport trigonométrique indiqué, puis utilise sa fonction réciproque en degrés.',d.angle>=5&&d.angle<=85);
 case 'reactor':{let found=null;function find(a){if(a.length>=2&&a.reduce((x,y)=>x+y,0)===d.exp){found=a;return true}if(a.length===d.budget)return false;return[1,2,-1,-2].some(n=>find([...a,n]))}find([]);return out({chain:found||[]},'Les multiplications ajoutent des exposants et les divisions en retirent.',!!found)}
 case 'diver':{let history=[0,1,2],pos=d.start,visited=[];history.forEach(id=>{pos+=d.items.find(t=>t.id===id).n;visited.push(pos)});return out({history},'Atteins d’abord exactement le trésor. Planifie ensuite les deux déplacements restants.',visited.slice(0,-1).includes(d.checkpoint)&&pos===d.end)}
 case 'market':{let amount=d.paid-d.price,tray=[];for(let c of d.coins){while(amount>=c&&tray.length<60){tray.push(c);amount-=c}}return out({tray},'Cherche le complément entre le prix et la somme reçue. Commence par les grandes pièces.',amount===0)}
 case 'clockwork':return out({h:Math.floor(d.target/60),m:d.target%60},'Avance jusqu’à l’heure suivante, puis ajoute les minutes restantes.',d.target<24*60&&d.target%5===0);
 case 'domino':return out({chain:d.tiles.map(t=>t.id).sort((a,b)=>a-b)},'Cherche la pièce dont la partie gauche vaut le nombre ouvert à droite du serpent.',d.tiles.slice().sort((a,b)=>a.id-b.id).every((t,i,a)=>t.left===(i===0?d.start:a[i-1].right)));
 case 'memory':return out({matched:[...new Set(d.cards.map(c=>c.pair))],open:[]},'Commence par une zone du jardin et mémorise une position à la fois.',d.cards.length>=2&&[...new Set(d.cards.map(c=>c.pair))].every(p=>d.cards.filter(c=>c.pair===p).length===2));
 case 'tangram':{let cells=Array(d.w*d.h).fill(-1),placed={},id=0;for(let y=0;y<d.h;y+=2)for(let x=0;x<d.w;x+=3){for(let[ox,turn]of[[x,0],[x+1,2]]){let coords=rotatePiece(d.shape,turn).map(([a,b])=>[a+ox,b+y]);coords.forEach(([X,Y])=>cells[Y*d.w+X]=id);placed[id]={x:ox,y,turn};id++}}return out({cells,placed,selected:0},'Deux pièces en L peuvent remplir un rectangle de 3 cases sur 2. Répète ce petit assemblage.',id===d.n&&cells.every(v=>v>=0))}
 case 'pizza':return out({n:d.den,slices:Array.from({length:d.num},(_,i)=>i)},'Découpe d’abord la pizza en autant de parts que le dénominateur, puis prends le nombre de parts du numérateur.',d.den>=2&&d.den<=8&&d.num<d.den);
 case 'chartsmith':return out({bars:d.values.slice()},'Chaque étage vaut une observation. Reporte les valeurs du carnet sans changer l’échelle.',d.values.every(v=>v>=0&&v<=14));
 case 'plotter':return out({point:[d.cx,d.cy]},'Le sommet recherché est un nœud commun aux deux cercles, au-dessus du segment.',same(Math.hypot(d.cx,d.cy),d.ra)&&same(Math.hypot(d.cx-d.base,d.cy),d.rb)&&d.cy>0&&d.cx<d.nx&&d.cy<d.ny);
 case 'tiles':return out({counts:d.target.slice()},'Décompose l’aire du rectangle : chaque terme du premier facteur multiplie chacun des termes du second.',d.target.every(v=>v>=0&&v<=40));
 case 'median':return out({values:d.values.slice().sort((a,b)=>a-b),selected:null},'Place d’abord le plus petit wagon à gauche, puis continue avec les valeurs restantes.',d.values.length%2===1);
 case 'homothety':return out({points:d.target.map(p=>p.slice())},'Multiplie les deux coordonnées de chaque point par le rapport demandé.',d.target.every(p=>p.every(n=>n>=0&&n<d.n)));
 default:return{valid:false,patch:{},hint:'Ce moteur doit disposer de son propre vérificateur.'};
 }
}

function firstUnfinished(id,chapter){return levelsFor(id,chapter).find(l=>!record(id).won.includes(l))||levelsFor(id,chapter)[0]}
function recommend(){for(const c of bookProgramme[state.grade].chapters){for(const id of c.games){if(!journeys[state.grade].includes(id))continue;const level=levelsFor(id,c.code).find(l=>!record(id).won.includes(l));if(level)return{id,level,code:c.code,title:c.title}}}return null}
function openFromChapter(id,code,level){state.chapter=code;openGame(id,level||firstUnfinished(id,code),{chapter:code})}
function showRoute(){game=null;state.page='route';header();const book=bookProgramme[state.grade];$('#view').innerHTML=`<div class="intro"><div><div class="eyebrow">LA CARTE DES SAVOIRS</div><h1>${esc(book.name)}</h1><p>${esc(book.edition)}</p></div><label class="level-control"><select id="routeGrade" aria-label="Choisir une classe">${gradeNames.map((n,i)=>`<option value="${i}" ${state.grade===i?'selected':''}>${n}</option>`).join('')}</select></label></div><div class="route-intro">${icon('book',17)} <strong>Les chapitres viennent des références indiquées.</strong> Un atelier ne couvre qu’une partie d’un chapitre. Les chapitres sans jeu sont marqués « à développer », et les titres non vérifiés restent explicitement à confirmer. Les étoiles mesurent les missions terminées, pas la maîtrise de l’ensemble du livre.</div><div class="chapter-source">Source principale : <a href="${book.source}" target="_blank" rel="noopener noreferrer">ouvrir le document ou la page de ressources</a>. Choix de la prochaine escale libre : aucun chapitre n’est bloqué artificiellement.</div><div class="chapter-map">${book.chapters.map(c=>{const available=c.games.filter(id=>journeys[state.grade].includes(id));const total=available.reduce((s,id)=>s+levelsFor(id,c.code).length,0),done=available.reduce((s,id)=>s+levelsFor(id,c.code).filter(l=>record(id).won.includes(l)).length,0);return `<section class="chapter-card ${available.length?'':'pending'}"><div class="chapter-card-top"><span class="chapter-code">${c.code}</span><h2>${esc(c.title)}</h2></div><p>${!c.verified?'Repère ou titre à confirmer : pas de promesse d’alignement exact.':available.length?'Titre vérifié · ateliers sur des compétences partielles du chapitre.':'Titre vérifié · aucun atelier disponible pour ce chapitre, pour le moment.'}</p><div class="chapter-games">${available.map(id=>`<button data-chapter-game="${id}" data-code="${c.code}">${engines[id].title} ${icon('arrow',10)}</button>`).join('')||'<span style="font-size:11px;color:#b3a2bf">À développer</span>'}</div>${total?`<div class="bar"><i style="width:${done/total*100}%"></i></div><div class="coverage-line"><span>${done}/${total} missions d’ateliers réussies</span><span>${done===total?'Parcours disponible terminé':'Accès libre'}</span></div>`:''}${c.source?`<div class="chapter-source"><a href="${c.source}" target="_blank" rel="noopener noreferrer">Introduction d’unité consultée</a></div>`:''}</section>`}).join('')}</div><div class="session-end"><strong>Tu peux t’arrêter à n’importe quelle escale.</strong> Les missions réussies restent dans ton carnet. Rien ne disparaît si tu reviens un autre jour.</div>`;$('#routeGrade').onchange=e=>{state.grade=Number(e.target.value);state.chapter='all';save();showRoute()};document.querySelectorAll('[data-chapter-game]').forEach(b=>b.onclick=()=>openFromChapter(b.dataset.chapterGame,b.dataset.code));window.scrollTo({top:0,behavior:'instant'})}
openGame=function(id,level=1,options={}){level=Math.max(1,Math.min(MISSION_COUNT,level));const oldTable=id==='factory'&&game?.id===id?game.table:0;state.page='game';let seed=options.seed??Math.floor(Math.random()*4294967295);const chapter=options.chapter||state.chapter;game={id,level,table:oldTable,seed,chapter,token:Math.random(),won:false,message:'À toi d’explorer : ce niveau possède une construction de solution vérifiée.',messageType:'',hint:false,hintStep:0};const e=engines[id];let generated=false;for(let retry=0;retry<32;retry++){const g=state.grade===4&&id==='blocks'&&level>3?5:state.grade;game.data=seededCreate((seed+retry)>>>0,()=>e.create(g,level));e.init?.(game.data);const proof=proofFor(id,game.data,state.grade);const robotSignature=id==='robot'&&proof.valid?JSON.stringify(proof.patch.program):null;const duplicateRobot=id==='robot'&&options.seed===undefined&&robotSignature===lastRobotSolutionByGrade[state.grade];const puzzleKey=[state.grade,id,level].join(':');const puzzleSignature=id==='robot'?robotSignature:missionPuzzleSignature(id,game.data);const duplicatePuzzle=options.seed===undefined&&puzzleSignature===lastMissionPuzzles[puzzleKey];if(proof.valid&&!duplicateRobot&&(!duplicatePuzzle||retry===31)){lastMissionPuzzles[puzzleKey]=puzzleSignature;if(id==='robot')lastRobotSolutionByGrade[state.grade]=robotSignature;game.proof=proof;game.initial=structuredClone(game.data);game.seed=(seed+retry)>>>0;generated=true;break}}if(!generated){$('#view').innerHTML='<div class="empty">Ce niveau ne passe pas sa vérification de construction. Aucun puzzle impossible ne sera affiché.<br><button class="primary" id="safeHome">Choisir un autre jeu</button></div>';$('#safeHome').onclick=()=>navigate('home');return}header();renderGame();window.scrollTo({top:0,behavior:'instant'})};
const previousRenderGame=renderGame;
renderGame=function(){previousRenderGame();if(state.grade===1&&game.id==='factory')$('#tableSelect')?.closest('label')?.remove();$('#restart').onclick=()=>openGame(game.id,game.level,{seed:game.seed,chapter:game.chapter});$('#ideaBtn').onclick=advanceHint;$('.pedagogy').insertAdjacentHTML('afterbegin',`<div class="quality-badge">${icon('check',13)} Construction de solution vérifiée · rejouable avec la même graine</div>`);const book=bookProgramme[state.grade],chapter=book.chapters.find(c=>c.code===game.chapter&&c.games.includes(game.id));if(chapter)$('.arcade-head').insertAdjacentHTML('afterend',`<div class="chapter-source">${esc(book.name)} · ${chapter.code} — ${esc(chapter.title)} · compétence partielle du chapitre</div>`)};
const previousRenderBoard=renderBoard;

const previousWin=win;
win=function(text,extra=''){if(game?.won)return;state.sessionWins++;previousWin(text,extra);save()};
function advanceHint(){if(!game)return;game.hintStep++;const e=engines[game.id];$('#idea').innerHTML=`<div class="idea"><strong>Indice ${Math.min(3,game.hintStep)}</strong><br>${game.hintStep===1?e.idea:game.proof.hint}<div class="help-levels">${game.hintStep>=2?'<button id="constructWitness">Voir une construction possible sur le plateau</button>':''}<button id="anotherHint">${game.hintStep===1?'Un indice plus concret':'Garder cet indice et essayer'}</button></div><small>Les aides ne retirent pas d’étoile. Observer une construction peut aussi servir à apprendre.</small></div>`;if($('#constructWitness'))$('#constructWitness').onclick=()=>{if(game.won)return;Object.assign(game.data,structuredClone(game.proof.patch));game.demoUsed=true;message(game.id==='robot'?'Voici un programme possible. Lance-le pour observer son exécution.':'Voici une construction possible. Observe-la, puis vérifie-la ou recommence avec la même mission.','good');renderBoard()};$('#anotherHint').onclick=()=>{if(game.hintStep===1)advanceHint();else $('#board').scrollIntoView({behavior:'smooth',block:'center'})}}
