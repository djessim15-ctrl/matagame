dth="67" height="67" rx="6" fill="#b99ed9"/><rect x="141" y="35" width="25" height="67" rx="5" fill="#9bbda5"/><rect x="175" y="77" width="25" height="25" rx="5" fill="#e3bf80"/><text x="99" y="76" text-anchor="middle" fill="#fff" font-size="23">x²</text>';else if(id==='median')body=[3,9,12,16,21].map((v,i)=>`<rect x="${35+i*40}" y="50" width="33" height="48" rx="7" fill="${i===2?'#e7c68d':'#c7b2df'}"/><text x="${51+i*40}" y="79" text-anchor="middle" fill="#fff" font-size="15">${v}</text>`).join('');else if(id==='plotter')body='<circle cx="100" cy="101" r="68" fill="none" stroke="#c6b0df" stroke-width="2"/><circle cx="167" cy="101" r="68" fill="none" stroke="#e4c17f" stroke-width="2"/><path d="M100 101 134 42 167 101Z" fill="#d1bee655" stroke="#a889c7" stroke-width="2"/>';else if(id==='homothety')body='<path d="M51 119 96 103 69 82Z" fill="#ad91cd"/><path d="M51 119 186 71 105 8Z" fill="none" stroke="#dcb97d" stroke-width="2"/><path d="M51 119 186 71m-135 48 54-111" stroke="#d8c5e7" stroke-dasharray="5 4"/>';else body=Array.from({length:12},(_,i)=>`<rect x="${65+i%6*22}" y="${47+Math.floor(i/6)*24}" width="19" height="21" rx="4" fill="${['#b39bd5','#e4c081','#93bda6','#c8a2bc'][Math.floor(i/3)%4]}"/>`).join('');return art(body,260,145)};

referencesPage=function(){state.page='about';header();$('#view').innerHTML=`<div class="intro"><div><div class="eyebrow">les sources, chapitre par chapitre</div><h1>Les livres, chapitre par chapitre.</h1><p>Références consultées le 31 octobre 2026. Jeux originaux, adaptation indépendante.</p></div></div><div class="reference-grid"><section class="reference-card"><h2>Ce qui est effectivement vérifié</h2><p>Les 17 unités du CP 2024 et les 12 unités du manuel multiniveau CE1/CE2 2025 ont été relevées sur les pages de ressources de l’éditeur. Sept introductions d’unités CM1/CM2 2026, des unités 3 à 9, ont été consultées. Les unités restantes gardent le statut « à confirmer ».</p><p>Pour le collège, les sommaires utilisés sont iParcours 6e 2025, 5e 2026, 4e et 3e 2022. Ces références ne signifient pas que toutes les compétences de ces ouvrages sont déjà développées dans les jeux.</p></section><section class="reference-card"><h2>Ce qui est vérifié dans les jeux</h2><p>Chaque niveau possède un certificat constructif : une configuration qui respecte ses contraintes. Les générateurs sont testés et la construction reste consultable avec l’aide. Recommencer conserve le même niveau ; rejouer une aventure produit de nouvelles configurations.</p><p>Le parcours est libre. Pas de vie perdue, de récompense payante, de série quotidienne obligatoire ni de contenu qui disparaît. Les compagnons sont des récompenses fixes liées aux missions réussies.</p></section></div><h2 style="font-size:18px;margin-top:26px">Les références, sans masquer les chapitres manquants</h2><div class="chapter-map">${bookProgramme.map((b,g)=>`<section class="chapter-card"><div class="chapter-card-top"><span class="chapter-code">${grades[g]}</span><h2>${esc(b.name)}</h2></div><p>${esc(b.edition)}</p><div class="chapter-source"><a href="${b.source}" target="_blank" rel="noopener noreferrer">Source de référence</a></div><button class="secondary" data-book-grade="${g}">Ouvrir la carte de ce livre</button></section>`).join('')}</div><div class="idea"><strong>Limites explicites.</strong> Les introductions et sommaires ne sont pas une lecture intégrale de tous les ouvrages. Les attributions de jeux à un chapitre indiquent des compétences partielles et non la couverture de tout le chapitre. Les activités de consolidation peuvent être accessibles hors du parcours du livre. Une revue enseignante et des essais avec des élèves restent nécessaires. Aucun agrément ni partenariat avec les éditeurs n’est revendiqué.</div>`;document.querySelectorAll('[data-book-grade]').forEach(b=>b.onclick=()=>{state.grade=Number(b.dataset.bookGrade);state.chapter='all';save();showRoute()})};

function progressConstraintError(id,d){switch(id){
 case'orchard':if(d.maxGestures!==null&&d.gestures>d.maxGestures)return`Le panier est juste, mais vise au plus ${d.maxGestures} gestes. Tu peux annuler tes gestes ou recommencer.`;break;
